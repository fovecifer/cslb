name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Go ${{ matrix.go-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            go-version: '1.21.x'
          - os: ubuntu-latest
            go-version: stable
          - os: macos-latest
            go-version: stable
          - os: windows-latest
            go-version: stable

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}

      - name: Run tests
        run: go test -shuffle=on ./...

      - name: Run static analysis
        run: go vet ./...

      - name: Run race detector
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable' }}
        run: go test -race ./...

      - name: Stress randomized test order
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable' }}
        run: go test -shuffle=on -count=5 ./...

      - name: Run fuzz smoke tests
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable' }}
        shell: bash
        run: |
          for target in \
            FuzzNewTransportEConfiguration \
            FuzzTransportBodyReplay \
            FuzzBalancerStateMachine \
            FuzzClientIP; do
            go test -run='^$' -fuzz="^${target}$" -fuzztime=2s .
          done

      - name: Run benchmark smoke tests
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable' }}
        run: go test -run='^$' -bench=. -benchtime=1x ./...

      - name: Measure coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable' }}
        run: go test -covermode=atomic -coverprofile=coverage.out ./...

      - name: Enforce exact coverage
        if: ${{ matrix.os == 'ubuntu-latest' && matrix.go-version == 'stable' }}
        shell: bash
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {gsub(/%/, "", $3); print $3}')"
          if [[ -z "${total}" ]]; then
            echo 'Unable to determine total coverage.' >&2
            exit 1
          fi
          missed="$(awk 'NR > 1 && $3 == 0 { missed += $2 } END { print missed + 0 }' coverage.out)"
          echo "Total coverage: ${total}% (${missed} uncovered statements)"
          if [[ "${missed}" -ne 0 ]]; then
            awk 'NR > 1 && $3 == 0 { print }' coverage.out >&2
            exit 1
          fi
